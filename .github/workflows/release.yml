name: "Release Multiplatform"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Tauri app & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag || 'v__VERSION__') }}
          releaseName: 'VibeDeck v__VERSION__'
          releaseBody: |
            ## VibeDeck v__VERSION__ 🚀
            
            Multi-terminal AI Agent Cockpit & Modern IDE workspace for vibe coders.

            ### Binaries available:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg`
            - **macOS (Intel)**: `.dmg`
            - **Windows**: `.exe` (NSIS) / `.msi`
            - **Linux**: `.AppImage` / `.deb`

            ### What's Inside:
            - Multi-terminal grid with xterm.js & low-latency PTY
            - Built-in Agent launcher (Claude Code, OpenAI Codex, Kimi, Google Gemini, Antigravity/Agy, custom)
            - Integrated File Explorer with fast previews and Reveal in Finder/Explorer
            - Git branch indicators & per-terminal working directory management
            - Drag & drop reordering, dynamic layout presets, and theme customization
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
